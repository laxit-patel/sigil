<!doctype html>
<meta charset="utf-8">
<title>Sigil — drawing a wire-format response</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; margin: 3rem; background: #fbfbfa; color: #1a1a19; }
  svg  { width: 200px; height: 240px; }
  pre  { background: #f2f2f0; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 13px; }
</style>

<h1>Drawing a Sigil response</h1>
<p>
  This page has no digit map, no quadrant table, and no copy of
  <code>model.json</code>. It received a segment list and drew it. That is the
  whole point of Tier 2.
</p>

<svg id="glyph" viewBox="16 6 168 228" role="img" aria-label="Sigil glyph"></svg>
<pre id="src"></pre>

<script>
  // Exactly what `php examples/03-wire-format.php 7323` prints.
  const response = {
    number: 7323,
    stem: [100, 20, 100, 220],
    segments: [
      { quadrant: "ones",      segment: "diagDown", x1: 100, y1:  20, x2: 170, y2: 120 },
      { quadrant: "tens",      segment: "bottom",   x1: 100, y1: 120, x2:  30, y2: 120 },
      { quadrant: "hundreds",  segment: "diagDown", x1: 100, y1: 120, x2: 170, y2: 220 },
      { quadrant: "thousands", segment: "top",      x1: 100, y1: 120, x2:  30, y2: 120 },
      { quadrant: "thousands", segment: "outer",    x1:  30, y1: 120, x2:  30, y2: 220 }
    ]
  };

  // The entire client-side implementation.
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("glyph");

  const line = ([x1, y1, x2, y2], width) => {
    const el = document.createElementNS(NS, "line");
    el.setAttribute("x1", x1); el.setAttribute("y1", y1);
    el.setAttribute("x2", x2); el.setAttribute("y2", y2);
    el.setAttribute("stroke", "#2a2a28");
    el.setAttribute("stroke-width", width);
    el.setAttribute("stroke-linecap", "round");
    svg.appendChild(el);
  };

  line(response.stem, 8);
  for (const s of response.segments) line([s.x1, s.y1, s.x2, s.y2], 6);

  document.getElementById("src").textContent = JSON.stringify(response, null, 2);
</script>
