name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The implementations live in their own repos, so drift can appear here
  # without anything being pushed to this one.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Implementations match the canonical model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # This repo owns model.json and fixtures/vectors.json. Each language
      # implementation vendors a copy so it can be installed and tested
      # standalone -- which means a copy that can drift. Catching that is this
      # repo's job, because this repo is where the definition lives.
      - name: Every implementation vendors the canonical model and fixtures
        run: |
          set -e
          rc=0

          for impl in */; do
            impl="${impl%/}"
            [ -f "$impl/composer.json" ] || [ -f "$impl/package.json" ] || [ -f "$impl/pyproject.toml" ] || continue

            echo "── $impl"

            for file in model.json fixtures/vectors.json fixtures/vectors-wide.json; do
              if [ ! -f "$impl/$file" ]; then
                echo "   MISSING  $impl/$file"
                rc=1
                continue
              fi

              if diff -q "$file" "$impl/$file" > /dev/null; then
                echo "   ok       $file"
              else
                echo "   DRIFTED  $impl/$file differs from the canonical $file"
                diff -u "$file" "$impl/$file" | head -40 || true
                rc=1
              fi
            done
          done

          if [ "$rc" -ne 0 ]; then
            echo
            echo "An implementation is carrying a stale copy of the definition."
            echo "Copy the canonical files into it and commit, then update the"
            echo "submodule pointer here."
          fi

          exit $rc

  model:
    name: model.json is well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Cheap structural guard on the one file every implementation loads.
      # A malformed model breaks every language at once.
      - name: Validate model.json
        run: |
          php -r '
            $m = json_decode(file_get_contents("model.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (["version","places","geometryDefaults","segments","digitMap"] as $k) {
              if (!isset($m[$k])) { fwrite(STDERR, "missing key: $k\n"); exit(1); }
            }
            if (isset($m["range"])) { fwrite(STDERR, "range must be derived from places, not declared\n"); exit(1); }
            if (count($m["digitMap"]) !== 10) { fwrite(STDERR, "digitMap must have 10 entries\n"); exit(1); }
            $bits = count($m["segments"]);
            foreach ($m["digitMap"] as $d => $mask) {
              if ($mask < 0 || $mask >= (1 << $bits)) { fwrite(STDERR, "digit $d mask out of range\n"); exit(1); }
            }
            if (count($m["places"]) > 18) { fwrite(STDERR, "more than 18 places cannot be held exactly in an int\n"); exit(1); }
            $seen = [];
            foreach ($m["places"] as $p) {
              foreach (["name","side","row"] as $k) { if (!isset($p[$k])) { fwrite(STDERR, "place missing $k\n"); exit(1); } }
              if (!in_array($p["side"], ["left","right"], true)) { fwrite(STDERR, "bad side: {$p["side"]}\n"); exit(1); }
              $spot = $p["side"] . ":" . $p["row"];
              if (isset($seen[$spot])) { fwrite(STDERR, "two places share the spot $spot\n"); exit(1); }
              $seen[$spot] = true;
            }
            $rows = max(array_column($m["places"], "row")) + 1;
            printf("model.json ok: %d segments, %d places, %d rows, max %d\n", $bits, count($m["places"]), $rows, 10 ** count($m["places"]) - 1);
          '
